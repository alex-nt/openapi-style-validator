buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:8.3.5"
    }
}

plugins {
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id "org.sonarqube" version "6.0.1.5171"
}

sonarqube {
    properties {
        property "sonar.projectKey", "OpenAPITools_openapi-style-validator"
        property "sonar.organization", "openapitools"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

wrapper {
    gradleVersion = '8.12'
}

allprojects {
    version = '1.12-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    test {
        if(project.name != 'openapi-style-validator-maven-plugin') {
            useJUnitPlatform()
        }
    }

    repositories {
        mavenCentral()
    }

    group = 'org.openapitools.openapistylevalidator'

    dependencies {
        implementation 'org.slf4j:slf4j-api:2.0.16'
        testCompileOnly 'org.junit.jupiter:junit-jupiter-params:5.11.0'
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.0'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.0'
    }

    signing {
        useGpgCmd()
        sign(publishing.publications)
    }

    tasks.withType(Sign) {
        onlyIf {
            project.hasProperty('signing.gnupg.keyName')
        }
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = false
        }
    }

    check.dependsOn jacocoTestReport
}

nexusPublishing {
    packageGroup = 'org.openapitools'

    repositories {
        sonatype {
            username = System.getenv('SONATYPE_USER') ?: ''
            password = System.getenv('SONATYPE_PASSWORD') ?: ''
        }
    }
}